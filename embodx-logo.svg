<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with futuristic gradient -->
  <circle cx="64" cy="64" r="64" fill="url(#gradient)" />

  <!-- Outer ring with glow effect -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="url(#glow)" stroke-width="4" opacity="0.6"/>

  <!-- Main X structure -->
  <g transform="translate(64, 64)">
    <!-- X lines with futuristic styling -->
    <line x1="-24" y1="-24" x2="24" y2="24" stroke="url(#xGradient)" stroke-width="8" stroke-linecap="round"/>
    <line x1="24" y1="-24" x2="-24" y2="24" stroke="url(#xGradient)" stroke-width="8" stroke-linecap="round"/>

    <!-- Central core -->
    <circle cx="0" cy="0" r="12" fill="url(#coreGradient)" stroke="white" stroke-width="2"/>

    <!-- Futuristic nodes on X -->
    <circle cx="-16" cy="-16" r="4" fill="#00ffff" opacity="0.8"/>
    <circle cx="16" cy="-16" r="4" fill="#00ffff" opacity="0.8"/>
    <circle cx="-16" cy="16" r="4" fill="#00ffff" opacity="0.8"/>
    <circle cx="16" cy="16" r="4" fill="#00ffff" opacity="0.8"/>

    <!-- Energy lines -->
    <line x1="-12" y1="-12" x2="-4" y2="-4" stroke="#00ffff" stroke-width="2" opacity="0.6"/>
    <line x1="12" y1="-12" x2="4" y2="-4" stroke="#00ffff" stroke-width="2" opacity="0.6"/>
    <line x1="-12" y1="12" x2="-4" y2="4" stroke="#00ffff" stroke-width="2" opacity="0.6"/>
    <line x1="12" y1="12" x2="4" y2="4" stroke="#00ffff" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- AI Circuit patterns -->
  <g opacity="0.4">
    <!-- Top circuit -->
    <rect x="32" y="16" width="4" height="4" fill="#00ffff"/>
    <rect x="40" y="16" width="4" height="4" fill="#00ffff"/>
    <rect x="48" y="16" width="4" height="4" fill="#00ffff"/>
    <rect x="36" y="24" width="4" height="4" fill="#00ffff"/>
    <rect x="44" y="24" width="4" height="4" fill="#00ffff"/>

    <!-- Bottom circuit -->
    <rect x="32" y="88" width="4" height="4" fill="#00ffff"/>
    <rect x="40" y="88" width="4" height="4" fill="#00ffff"/>
    <rect x="48" y="88" width="4" height="4" fill="#00ffff"/>
    <rect x="36" y="96" width="4" height="4" fill="#00ffff"/>
    <rect x="44" y="96" width="4" height="4" fill="#00ffff"/>

    <!-- Left circuit -->
    <rect x="16" y="32" width="4" height="4" fill="#00ffff"/>
    <rect x="16" y="40" width="4" height="4" fill="#00ffff"/>
    <rect x="16" y="48" width="4" height="4" fill="#00ffff"/>
    <rect x="24" y="36" width="4" height="4" fill="#00ffff"/>
    <rect x="24" y="44" width="4" height="4" fill="#00ffff"/>

    <!-- Right circuit -->
    <rect x="92" y="32" width="4" height="4" fill="#00ffff"/>
    <rect x="92" y="40" width="4" height="4" fill="#00ffff"/>
    <rect x="92" y="48" width="4" height="4" fill="#00ffff"/>
    <rect x="100" y="36" width="4" height="4" fill="#00ffff"/>
    <rect x="100" y="44" width="4" height="4" fill="#00ffff"/>
  </g>

  <!-- Holographic effects -->
  <g opacity="0.3">
    <circle cx="64" cy="64" r="40" fill="none" stroke="#00ffff" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="64" cy="64" r="48" fill="none" stroke="#ff00ff" stroke-width="2" stroke-dasharray="2,6"/>
  </g>

  <!-- Additional futuristic elements -->
  <g opacity="0.2">
    <!-- Corner brackets -->
    <path d="M16 16 L24 16 L24 24 L16 24 Z" fill="none" stroke="#00ffff" stroke-width="1"/>
    <path d="M88 16 L96 16 L96 24 L88 24 Z" fill="none" stroke="#00ffff" stroke-width="1"/>
    <path d="M16 88 L24 88 L24 96 L16 96 Z" fill="none" stroke="#00ffff" stroke-width="1"/>
    <path d="M88 88 L96 88 L96 96 L88 96 Z" fill="none" stroke="#00ffff" stroke-width="1"/>
  </g>

  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f23;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="xGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="coreGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#ff00ff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:0.8" />
    </linearGradient>
  </defs>
</svg>
