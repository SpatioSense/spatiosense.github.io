<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with deep space gradient -->
  <circle cx="32" cy="32" r="32" fill="url(#gradient)" />

  <!-- Outer energy ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#energyRing)" stroke-width="2" opacity="0.8"/>

  <!-- Secondary ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#secondaryRing)" stroke-width="1" opacity="0.6"/>

  <!-- Main X structure with enhanced futuristic styling -->
  <g transform="translate(32, 32)">
    <!-- X lines with energy gradient -->
    <line x1="-14" y1="-14" x2="14" y2="14" stroke="url(#xGradient)" stroke-width="5" stroke-linecap="round"/>
    <line x1="14" y1="-14" x2="-14" y2="14" stroke="url(#xGradient)" stroke-width="5" stroke-linecap="round"/>

    <!-- Central energy core -->
    <circle cx="0" cy="0" r="7" fill="url(#coreGradient)" stroke="white" stroke-width="1.5"/>

    <!-- Inner energy ring -->
    <circle cx="0" cy="0" r="4" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.8"/>

    <!-- Futuristic nodes with glow -->
    <circle cx="-10" cy="-10" r="2.5" fill="#00ffff" opacity="0.9"/>
    <circle cx="10" cy="-10" r="2.5" fill="#00ffff" opacity="0.9"/>
    <circle cx="-10" cy="10" r="2.5" fill="#00ffff" opacity="0.9"/>
    <circle cx="10" cy="10" r="2.5" fill="#00ffff" opacity="0.9"/>

    <!-- Energy connection lines -->
    <line x1="-7" y1="-7" x2="-2" y2="-2" stroke="#00ffff" stroke-width="1.5" opacity="0.7"/>
    <line x1="7" y1="-7" x2="2" y2="-2" stroke="#00ffff" stroke-width="1.5" opacity="0.7"/>
    <line x1="-7" y1="7" x2="-2" y2="2" stroke="#00ffff" stroke-width="1.5" opacity="0.7"/>
    <line x1="7" y1="7" x2="2" y2="2" stroke="#00ffff" stroke-width="1.5" opacity="0.7"/>

    <!-- Corner energy spikes -->
    <line x1="-16" y1="-16" x2="-12" y2="-12" stroke="#ff00ff" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="-16" x2="12" y2="-12" stroke="#ff00ff" stroke-width="2" stroke-linecap="round"/>
    <line x1="-16" y1="16" x2="-12" y2="12" stroke="#ff00ff" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="16" x2="12" y2="12" stroke="#ff00ff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Advanced AI Circuit patterns -->
  <g opacity="0.5">
    <!-- Top circuit cluster -->
    <rect x="14" y="6" width="2" height="2" fill="#00ffff"/>
    <rect x="18" y="6" width="2" height="2" fill="#00ffff"/>
    <rect x="22" y="6" width="2" height="2" fill="#00ffff"/>
    <rect x="26" y="6" width="2" height="2" fill="#00ffff"/>
    <rect x="16" y="10" width="2" height="2" fill="#00ffff"/>
    <rect x="20" y="10" width="2" height="2" fill="#00ffff"/>
    <rect x="24" y="10" width="2" height="2" fill="#00ffff"/>

    <!-- Bottom circuit cluster -->
    <rect x="14" y="46" width="2" height="2" fill="#00ffff"/>
    <rect x="18" y="46" width="2" height="2" fill="#00ffff"/>
    <rect x="22" y="46" width="2" height="2" fill="#00ffff"/>
    <rect x="26" y="46" width="2" height="2" fill="#00ffff"/>
    <rect x="16" y="50" width="2" height="2" fill="#00ffff"/>
    <rect x="20" y="50" width="2" height="2" fill="#00ffff"/>
    <rect x="24" y="50" width="2" height="2" fill="#00ffff"/>

    <!-- Left circuit cluster -->
    <rect x="6" y="14" width="2" height="2" fill="#00ffff"/>
    <rect x="6" y="18" width="2" height="2" fill="#00ffff"/>
    <rect x="6" y="22" width="2" height="2" fill="#00ffff"/>
    <rect x="6" y="26" width="2" height="2" fill="#00ffff"/>
    <rect x="10" y="16" width="2" height="2" fill="#00ffff"/>
    <rect x="10" y="20" width="2" height="2" fill="#00ffff"/>
    <rect x="10" y="24" width="2" height="2" fill="#00ffff"/>

    <!-- Right circuit cluster -->
    <rect x="48" y="14" width="2" height="2" fill="#00ffff"/>
    <rect x="48" y="18" width="2" height="2" fill="#00ffff"/>
    <rect x="48" y="22" width="2" height="2" fill="#00ffff"/>
    <rect x="48" y="26" width="2" height="2" fill="#00ffff"/>
    <rect x="52" y="16" width="2" height="2" fill="#00ffff"/>
    <rect x="52" y="20" width="2" height="2" fill="#00ffff"/>
    <rect x="52" y="24" width="2" height="2" fill="#00ffff"/>
  </g>

  <!-- Holographic grid effects -->
  <g opacity="0.3">
    <circle cx="32" cy="32" r="18" fill="none" stroke="#00ffff" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="32" cy="32" r="22" fill="none" stroke="#ff00ff" stroke-width="1" stroke-dasharray="1,3"/>
    <circle cx="32" cy="32" r="26" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="0.5,1.5"/>
  </g>

  <!-- Corner brackets with energy -->
  <g opacity="0.4">
    <path d="M8 8 L16 8 L16 12 L12 12 L12 16 L8 16 Z" fill="none" stroke="#00ffff" stroke-width="1"/>
    <path d="M48 8 L56 8 L56 16 L52 16 L52 12 L48 12 Z" fill="none" stroke="#00ffff" stroke-width="1"/>
    <path d="M8 48 L12 48 L12 52 L16 52 L16 56 L8 56 Z" fill="none" stroke="#00ffff" stroke-width="1"/>
    <path d="M48 48 L56 48 L56 56 L48 56 L52 52 L52 48 Z" fill="none" stroke="#00ffff" stroke-width="1"/>
  </g>

  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f23;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="xGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="coreGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="energyRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0.9" />
      <stop offset="25%" style="stop-color:#ff00ff;stop-opacity:0.7" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.5" />
      <stop offset="75%" style="stop-color:#ff00ff;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:0.9" />
    </linearGradient>

    <linearGradient id="secondaryRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#ff00ff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:0.6" />
    </linearGradient>
  </defs>
</svg>
